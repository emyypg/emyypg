<svg width="900" height="200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0010"/>
      <stop offset="100%" style="stop-color:#0d0025"/>
    </linearGradient>
    <linearGradient id="neon1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#ff00ff;stop-opacity:0"/>
      <stop offset="50%" style="stop-color:#ff00ff;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#ff00ff;stop-opacity:0"/>
    </linearGradient>
    <linearGradient id="neon2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#00ffff;stop-opacity:0"/>
      <stop offset="50%" style="stop-color:#00ffff;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#00ffff;stop-opacity:0"/>
    </linearGradient>
    <filter id="glow-pink">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glow-cyan">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glow-strong">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="900" height="200" fill="url(#bg)"/>

  <!-- Grid lines horizontal -->
  <line x1="0" y1="40" x2="900" y2="40" stroke="#ff00ff" stroke-width="0.3" stroke-opacity="0.15"/>
  <line x1="0" y1="80" x2="900" y2="80" stroke="#ff00ff" stroke-width="0.3" stroke-opacity="0.15"/>
  <line x1="0" y1="120" x2="900" y2="120" stroke="#ff00ff" stroke-width="0.3" stroke-opacity="0.15"/>
  <line x1="0" y1="160" x2="900" y2="160" stroke="#ff00ff" stroke-width="0.3" stroke-opacity="0.15"/>

  <!-- Grid lines vertical -->
  <line x1="100" y1="0" x2="100" y2="200" stroke="#00ffff" stroke-width="0.3" stroke-opacity="0.1"/>
  <line x1="200" y1="0" x2="200" y2="200" stroke="#00ffff" stroke-width="0.3" stroke-opacity="0.1"/>
  <line x1="300" y1="0" x2="300" y2="200" stroke="#00ffff" stroke-width="0.3" stroke-opacity="0.1"/>
  <line x1="400" y1="0" x2="400" y2="200" stroke="#00ffff" stroke-width="0.3" stroke-opacity="0.1"/>
  <line x1="500" y1="0" x2="500" y2="200" stroke="#00ffff" stroke-width="0.3" stroke-opacity="0.1"/>
  <line x1="600" y1="0" x2="600" y2="200" stroke="#00ffff" stroke-width="0.3" stroke-opacity="0.1"/>
  <line x1="700" y1="0" x2="700" y2="200" stroke="#00ffff" stroke-width="0.3" stroke-opacity="0.1"/>
  <line x1="800" y1="0" x2="800" y2="200" stroke="#00ffff" stroke-width="0.3" stroke-opacity="0.1"/>

  <!-- Animated scan line -->
  <rect x="0" y="0" width="900" height="3" fill="url(#neon2)" opacity="0.6">
    <animateTransform attributeName="transform" type="translate" from="0,0" to="0,200" dur="3s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;0.6;0.6;0" keyTimes="0;0.1;0.9;1" dur="3s" repeatCount="indefinite"/>
  </rect>

  <!-- Top neon line -->
  <rect x="0" y="1" width="900" height="1.5" fill="url(#neon1)" opacity="0.8"/>
  <!-- Bottom neon line -->
  <rect x="0" y="197" width="900" height="1.5" fill="url(#neon2)" opacity="0.8"/>

  <!-- Corner brackets -->
  <path d="M 15,15 L 15,5 L 25,5" stroke="#ff00ff" stroke-width="2" fill="none" filter="url(#glow-pink)"/>
  <path d="M 875,15 L 875,5 L 865,5" stroke="#ff00ff" stroke-width="2" fill="none" filter="url(#glow-pink)"/>
  <path d="M 15,185 L 15,195 L 25,195" stroke="#00ffff" stroke-width="2" fill="none" filter="url(#glow-cyan)"/>
  <path d="M 875,185 L 875,195 L 865,195" stroke="#00ffff" stroke-width="2" fill="none" filter="url(#glow-cyan)"/>

  <!-- Decorative dots -->
  <circle cx="450" cy="20" r="2" fill="#ff00ff" filter="url(#glow-pink)">
    <animate attributeName="opacity" values="1;0.3;1" dur="2s" repeatCount="indefinite"/>
  </circle>
  <circle cx="430" cy="20" r="1.5" fill="#00ffff" filter="url(#glow-cyan)">
    <animate attributeName="opacity" values="0.3;1;0.3" dur="2s" repeatCount="indefinite"/>
  </circle>
  <circle cx="470" cy="20" r="1.5" fill="#00ffff" filter="url(#glow-cyan)">
    <animate attributeName="opacity" values="0.3;1;0.3" dur="2.5s" repeatCount="indefinite"/>
  </circle>

  <!-- Main name text shadow/glow layer -->
  <text x="450" y="105" text-anchor="middle" font-family="'Courier New', monospace" font-size="58" font-weight="bold" fill="#ff00ff" opacity="0.15" filter="url(#glow-strong)">EMILY</text>

  <!-- Main name -->
  <text x="450" y="105" text-anchor="middle" font-family="'Courier New', monospace" font-size="58" font-weight="bold" fill="none" stroke="#ff00ff" stroke-width="1.5" filter="url(#glow-pink)">
    EMILY
    <animate attributeName="opacity" values="1;0.85;1" dur="4s" repeatCount="indefinite"/>
  </text>

  <!-- Subtitle -->
  <text x="450" y="135" text-anchor="middle" font-family="'Courier New', monospace" font-size="14" fill="#00ffff" letter-spacing="8" filter="url(#glow-cyan)">
    ◈  D E V E L O P E R  ◈
    <animate attributeName="opacity" values="1;0.6;1" dur="3s" repeatCount="indefinite"/>
  </text>

  <!-- Small tag line -->
  <text x="450" y="165" text-anchor="middle" font-family="'Courier New', monospace" font-size="10" fill="#ff00ff" letter-spacing="3" opacity="0.7">
    ARGENTINA, AR  //  WEB + UI/UX
  </text>

  <!-- Flicker particles -->
  <circle cx="80" cy="100" r="1" fill="#ff00ff">
    <animate attributeName="opacity" values="0;1;0" dur="1.5s" begin="0.3s" repeatCount="indefinite"/>
  </circle>
  <circle cx="820" cy="100" r="1" fill="#00ffff">
    <animate attributeName="opacity" values="0;1;0" dur="2s" begin="0.7s" repeatCount="indefinite"/>
  </circle>
  <circle cx="150" cy="60" r="1" fill="#ff00ff">
    <animate attributeName="opacity" values="0;1;0" dur="1.8s" begin="1s" repeatCount="indefinite"/>
  </circle>
  <circle cx="750" cy="140" r="1" fill="#00ffff">
    <animate attributeName="opacity" values="0;1;0" dur="1.3s" begin="0.5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="50" cy="150" r="0.8" fill="#ffffff">
    <animate attributeName="opacity" values="0;0.8;0" dur="2.2s" begin="1.2s" repeatCount="indefinite"/>
  </circle>
  <circle cx="850" cy="50" r="0.8" fill="#ffffff">
    <animate attributeName="opacity" values="0;0.8;0" dur="1.7s" begin="0.2s" repeatCount="indefinite"/>
  </circle>
</svg>
